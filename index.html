<!DOCTYPE html>
<!--
  ============================================================================
  UI ASSET PROMPTS - copy a full prompt line below into Gemini (Nano Banana),
  cut out the background if needed, then save as assets/<file>.
  Same workflow as tools/art-queue for the bomb/matchstick art.
  ============================================================================

  ---- STYLE LOCK (paste onto the end of every prompt below) ----
  1930s rubber-hose cartoon style, Fleischer Studios animation cel, thick
  hand-inked outline in warm dark brown #2B1F14, flat vintage cel colors,
  no gradients, no photo texture, no text, no letters, no watermark,
  centered, filling most of the frame, transparent background, PNG

  ---- BUTTON FRAME (draw the text with Luckiest Guy in code, so keep
       the frame art text-free) ----
  ui-btn.png:
  Chunky rounded rectangle game button frame, cream #F6ECD1 card fill, solid
  hard offset drop shadow in warm dark brown #2B1F14 slightly below and right,
  thin lighter highlight along the top-left inner edge, slightly darker band
  along the bottom inside edge, [STYLE LOCK]

  ui-btn-hover.png:
  Same chunky rounded rectangle game button frame as normal state but HOVER
  state, button lifted with a soft pale-yellow glow behind it, outline slightly
  thicker, [STYLE LOCK]

  ui-btn-pressed.png:
  Same chunky rounded rectangle game button frame but PRESSED state, button
  pushed flat down so the offset shadow disappears under the card, fill
  slightly darker, outline thicker, [STYLE LOCK]

  ---- ICONS (flat line-art, one object each) ----
  ui-icon-unmute.png:
  Tiny vintage gramophone horn speaker with three curved sound waves, [STYLE LOCK]

  ui-icon-mute.png:
  Tiny vintage gramophone horn speaker with a bold red X slash through it,
  [STYLE LOCK]

  ui-icon-hint.png:
  Classic cartoon lightbulb with short radial rays and a small exclamation
  mark inside, [STYLE LOCK]

  ui-icon-zoom-in.png:
  Vintage magnifying glass with a chunky plus sign inside the lens, [STYLE LOCK]

  ui-icon-zoom-out.png:
  Vintage magnifying glass with a chunky minus sign inside the lens, [STYLE LOCK]

  ui-icon-retry.png:
  Chubby circular arrow looping clockwise, [STYLE LOCK]

  ui-icon-next.png:
  Right-pointing cartoon hand with a pointing index finger and three motion
  lines behind it, [STYLE LOCK]

  ui-icon-scissors.png:
  Vintage tailor scissors with round finger loops, slightly open, [STYLE LOCK]

  ui-icon-star.png:
  Chunky five-pointed star with a small sparkle highlight on the top facet,
  [STYLE LOCK]

  ---- BACKGROUND LAYERS (keep the off-white vintage paper look) ----
  ui-bg-paper.png (512x512, seamless tile):
  Seamless tileable aged off-white paper texture #F2E8D0 with subtle hand-painted
  watercolor mottle, faint warm cream and beige blotches at very low contrast,
  gentle worn fibers, flat and uniform overall brightness, no vignette, no
  borders, tileable seamless pattern filling the whole frame, PNG, 512x512

  ui-bg-grain.png (256x256, seamless tile):
  Seamless tileable fine black-and-white film grain noise texture, uniform
  fine grain, subtle, flat, tileable seamless pattern filling the whole frame,
  PNG, 256x256

  ui-bg-scratches.png (seamless tile, transparent):
  Vintage film damage overlay on a transparent background, a few very fine
  vertical scratches and tiny dust specks near the edges, very low opacity,
  subtle, tileable seamless pattern, PNG

  ---- OPTIONAL: POPUP CARD FRAME (for win / retry / level-select modals) ----
  ui-card-modal.png:
  Chunky rounded rectangle game UI card frame for a popup dialog, cream
  #F6ECD1 card fill, solid hard offset drop shadow in warm dark brown #2B1F14,
  thin highlight along the top-left inner edge, [STYLE LOCK]
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cut the Fuse: Bomb Puzzle</title>
    <meta name="description" content="One snip from disaster. Cut the burning fuses before the sparks reach the bomb. 60 levels of snip-or-suffer puzzles. Free in the browser." />
    <meta name="keywords" content="Cut the Fuse, bomb puzzle, snipping game, arcade puzzle, browser game, hypercasual" />
    <meta name="author" content="Synalume, LLC" />
    <meta name="creator" content="Synalume, LLC" />
    <meta name="publisher" content="Synalume, LLC" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#F6ECD1" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Cut the Fuse" />
    <meta name="msapplication-TileColor" content="#F6ECD1" />
    <meta name="msapplication-TileImage" content="https://play.cutthefuse.com/icon-192.png?v=ctf2" />

    <link rel="canonical" href="https://play.cutthefuse.com/" />
    <link rel="image_src" href="https://play.cutthefuse.com/og.png?v=ctf2" />

    <link rel="apple-touch-icon" href="https://play.cutthefuse.com/apple-touch-icon.png?v=ctf2" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://play.cutthefuse.com/apple-touch-icon.png?v=ctf2" />
    <link rel="apple-touch-icon-precomposed" href="https://play.cutthefuse.com/apple-touch-icon.png?v=ctf2" />

    <!-- Favicons (tabs). Transparent PNG; .ico fallback. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=ctf2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=ctf2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=ctf2" />
    <link rel="icon" href="/favicon.ico?v=ctf2" sizes="any" />
    <link rel="manifest" href="/site.webmanifest?v=ctf2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cut the Fuse" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Link previews (iMessage / Slack / Discord / X) — 1200×630 marketing art. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cut the Fuse" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://play.cutthefuse.com/" />
    <meta property="og:title" content="Cut the Fuse" />
    <meta property="og:description" content="One snip from disaster. Cut the burning fuses before the sparks reach the bomb." />
    <meta property="og:image" content="https://play.cutthefuse.com/og.png?v=ctf2" />
    <meta property="og:image:secure_url" content="https://play.cutthefuse.com/og.png?v=ctf2" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cut the Fuse — a worried banana bomb with sparks racing down fuses toward it" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cut the Fuse" />
    <meta name="twitter:description" content="One snip from disaster. Cut the burning fuses before the sparks reach the bomb." />
    <meta name="twitter:image" content="https://play.cutthefuse.com/og.png?v=ctf2" />
    <meta name="twitter:image:alt" content="Cut the Fuse — a worried banana bomb with sparks racing down fuses toward it" />
    <meta name="twitter:url" content="https://play.cutthefuse.com/" />

    <link rel="stylesheet" href="style.css">
    <!-- YouTube Playables SDK — stripped in Playgama / Poki / portal builds -->
    <script src="https://www.youtube.com/game_api/v1"></script>
</head>
<body>

<div id="game-container">
    <canvas id="game-canvas"></canvas>
    <!-- Vintage film grain + scratches layered over the game, under the UI -->
    <div id="film-overlay" aria-hidden="true"></div>

    <div id="ui-layer">
        <div class="header">
            <div id="level-label" title="Level Select">LEVEL 1 ▾</div>
            <div id="star-display">★ 0</div>
            <div id="snips-counter">✂️ SNIPS: 2</div>
        </div>
        <div class="controls">
            <button id="btn-menu" title="Main Menu">☰</button>
            <button id="btn-mute" title="Mute"><img src="assets/ui/ui-icon-mute.png" alt="Mute"></button>
            <button id="btn-hint" title="Toggle X-Ray Hint"><img src="assets/ui/ui-icon-hint.png" alt="Hint"></button>
            <button id="btn-zoom-out" title="Zoom Out"><img src="assets/ui/ui-icon-zoom-out.png" alt="Zoom out"></button>
            <button id="btn-zoom-in" title="Zoom In"><img src="assets/ui/ui-icon-zoom-in.png" alt="Zoom in"></button>
        </div>
    </div>

    <!-- Tutorial overlay (driven by level.tutorial) -->
    <div id="tutorial-overlay">
        <div id="tutorial-box">
            <p id="tutorial-text"></p>
            <button id="tutorial-next">OK</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-lose" class="message-box">
        <button id="btn-retry"><img src="assets/ui/ui-icon-retry.png" alt="">TRY AGAIN</button>
    </div>

    <div id="modal-win" class="message-box">
        <div id="win-stars" class="win-stars"></div>
        <div id="win-stats">
            <span class="stat" id="win-time">TIME --</span>
            <span class="stat record" id="win-record" style="display: none;">NEW RECORD!</span>
            <span class="stat perfect" id="win-perfect" style="display: none;">PERFECT SNIPS <span id="win-perfect-count"></span></span>
            <span class="stat score" id="win-score">SCORE --</span>
            <span class="stat best" id="win-best" style="display: none;">NEW BEST!</span>
            <span class="stat streak" id="win-streak" style="display: none;">STREAK --</span>
        </div>
        <button id="btn-next"><img src="assets/ui/ui-icon-next.png" alt="">NEXT LEVEL</button>
    </div>

    <!-- DDA: offered after repeated fails -->
    <div id="modal-dda" class="message-box">
        <h1 style="color: #d97706;">FEELING STUCK?</h1>
        <p id="dda-text"></p>
        <button id="btn-dda-accept">YES, HELP ME</button>
        <button id="btn-dda-decline">NO, I GOT THIS</button>
    </div>

    <!-- End of content -->
    <div id="modal-end" class="message-box">
        <h1 style="color: #22c55e;">THAT'S ALL FOR NOW!</h1>
        <p>More acts are on the way.</p>
        <button id="btn-end-replay">PLAY AGAIN</button>
    </div>

    <!-- Skin select screen -->
    <div id="modal-skins" class="message-box skins">
        <h1>ARMORY</h1>
        <div id="skin-tabs">
            <button id="tab-payloads" class="active">BOMBS</button>
            <button id="tab-igniters">IGNITERS</button>
        </div>
        <div id="skin-grid"></div>
        <button id="btn-skins-close">BACK</button>
    </div>

    <!-- Level selector -->
    <div id="modal-levels" class="message-box level-select">
        <h1>LEVEL SELECT</h1>
        <div id="daily-row">
            <button id="btn-daily">🔥 TODAY'S CHALLENGE</button>
            <span id="daily-streak" class="daily-streak-pill">STREAK 0</span>
        </div>
        <div id="level-grid"></div>
        <button id="btn-levels-close">BACK</button>
    </div>

    <!-- Main menu hub — the home screen: PLAY resumes, everything else opens
         its own modal, and the armory/level-select BACK buttons route here. -->
    <div id="modal-menu" class="message-box main-menu">
        <h1>CUT THE FUSE</h1>
        <p class="menu-tagline">A BOMB PUZZLE</p>
        <div id="menu-stars" class="menu-stars">★ 0</div>
        <button id="btn-menu-play">PLAY</button>
        <button id="btn-menu-daily">🔥 TODAY'S CHALLENGE</button>
        <button id="btn-menu-levels">LEVEL SELECT</button>
        <button id="btn-menu-armory">ARMORY</button>
    </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
