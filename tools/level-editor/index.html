<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cut the Fuse — Level Editor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace;
            background: #f5f5f4; color: #1c1917; height: 100vh; display: flex; overflow: hidden;
        }
        #sidebar {
            width: 300px; min-width: 300px; background: #e7e5e4; border-right: 3px solid #1c1917;
            padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
        }
        h1 { font-size: 1.1rem; }
        .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        button, select, input {
            font-family: 'Courier New', Courier, monospace; font-size: 0.9rem;
            background: #f5f5f4; border: 2px solid #1c1917; border-radius: 6px;
            padding: 4px 8px; cursor: pointer;
        }
        button:hover { background: #fef08a; }
        button.active { background: #fef08a; }
        label { font-size: 0.8rem; font-weight: bold; }
        #fuse-list { display: flex; flex-direction: column; gap: 6px; }
        .fuse-card { border: 2px solid #1c1917; border-radius: 8px; padding: 6px; background: #f5f5f4; font-size: 0.8rem; }
        .fuse-card .row { gap: 4px; }
        .fuse-card input { width: 70px; }
        #status { font-size: 0.75rem; color: #44403c; min-height: 16px; }
        #canvas-wrap { flex: 1; position: relative; }
        canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
        #mode-hint {
            position: absolute; top: 8px; left: 8px; background: #1c1917; color: #f5f5f4;
            padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; pointer-events: none;
        }
        .legend { font-size: 0.75rem; line-height: 1.5; }
    </style>
</head>
<body>
<div id="sidebar">
    <h1>LEVEL EDITOR</h1>
    <div class="row">
        <button id="btn-prev">◀</button>
        <select id="level-select"></select>
        <button id="btn-next">▶</button>
    </div>
    <div class="row">
        <button id="btn-edit" class="active">✏️ EDIT</button>
        <button id="btn-test">🎮 TEST</button>
        <button id="btn-reset">↺ RESET</button>
    </div>
    <div class="row">
        <label>SNIPS</label>
        <input type="number" id="snips" min="1" max="10" value="2" style="width:60px">
        <button id="btn-export">💾 EXPORT</button>
    </div>
    <div class="row">
        <button id="btn-add-spawn">+ SPAWN</button>
        <button id="btn-add-intersection">+ CHOKEPOINT</button>
    </div>
    <div class="legend">
        🔴 payload &nbsp;🟠 spawn &nbsp;✚ chokepoint<br>
        EDIT: drag to move. TEST: swipe to cut.
    </div>
    <label>FUSES</label>
    <div id="fuse-list"></div>
    <div id="status"></div>
</div>
<div id="canvas-wrap">
    <canvas id="editor-canvas"></canvas>
    <div id="mode-hint">EDIT MODE — drag nodes</div>
</div>
<script type="module" src="./editor.js"></script>
</body>
</html>
